<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSpace Companion</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { background: #f7f2e9; color: #25322c; font: 20px/1.5 system-ui, sans-serif; margin: 0; }
      main { margin: 0 auto; max-width: 720px; min-height: 100vh; padding: 3rem 1.25rem; text-align: center; }
      h1 { font-size: clamp(2.2rem, 7vw, 3.5rem); margin: 0 0 .5rem; }
      .intro { color: #526159; margin: 0 auto 2rem; max-width: 540px; }
      #conversation { background: #176b57; border: 0; border-radius: 999px; box-shadow: 0 7px 18px #176b5730; color: white; cursor: pointer; font: inherit; font-size: 1.15rem; font-weight: 700; min-height: 72px; min-width: 230px; padding: 0 2rem; }
      #conversation.stop { background: #8b3f3f; }
      #status { font-weight: 650; min-height: 3rem; margin: 1.5rem 0; }
      .mic-activity { margin: -1rem auto 1.5rem; max-width: 440px; }
      .mic-labels { align-items: center; color: #526159; display: flex; font-size: .8rem; justify-content: space-between; margin-bottom: .35rem; }
      #mic-state { color: #25322c; font-weight: 700; }
      .mic-meter { background: #dedbd3; border-radius: 999px; height: 18px; overflow: hidden; position: relative; }
      #mic-fill { background: #78867f; border-radius: inherit; height: 100%; transform-origin: left; transition: transform 80ms linear, background 120ms ease; }
      #mic-threshold { background: #25322c; height: 100%; opacity: .5; position: absolute; top: 0; width: 3px; }
      .mic-activity.sound #mic-fill { background: #d19032; }
      .mic-activity.voice #mic-fill { background: #176b57; }
      .pulse { animation: pulse 1.5s ease-in-out infinite; display: inline-block; }
      @keyframes pulse { 50% { opacity: .45; transform: scale(.92); } }
      .messages { display: grid; gap: 1rem; margin-top: 2rem; text-align: left; }
      .card { background: white; border-radius: 18px; box-shadow: 0 4px 16px #2f463817; padding: 1rem 1.2rem; }
      .card strong { color: #176b57; display: block; font-size: .9rem; letter-spacing: .04em; margin-bottom: .35rem; text-transform: uppercase; }
      .card p { margin: 0; }
      .hidden { display: none; }
      audio { margin-top: 1.5rem; width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>RSpace</h1>
      <p class="intro">A gentle place to talk. Start once, then speak naturally whenever you’re ready.</p>
      <button id="conversation">Start conversation</button>
      <p id="status" aria-live="polite">I’m ready when you are.</p>
      <div id="mic-activity" class="mic-activity hidden" aria-hidden="true">
        <div class="mic-labels"><span>Microphone activity</span><span id="mic-state">Waiting for voice</span></div>
        <div class="mic-meter">
          <div id="mic-fill"></div>
          <div id="mic-threshold" title="Voice threshold"></div>
        </div>
      </div>
      <section id="messages" class="messages hidden" aria-live="polite">
        <div class="card"><strong>You said</strong><p id="transcript"></p></div>
        <div class="card"><strong>RSpace</strong><p id="reply"></p></div>
      </section>
      <audio id="audio" playsinline></audio>
    </main>

    <script>
      const button = document.querySelector('#conversation');
      const status = document.querySelector('#status');
      const messages = document.querySelector('#messages');
      const transcriptElement = document.querySelector('#transcript');
      const replyElement = document.querySelector('#reply');
      const audio = document.querySelector('#audio');
      const micActivity = document.querySelector('#mic-activity');
      const micFill = document.querySelector('#mic-fill');
      const micThreshold = document.querySelector('#mic-threshold');
      const micState = document.querySelector('#mic-state');
      const userId = 'demo_user';

      let active = false;
      let stream;
      let recorder;
      let audioContext;
      let analyser;
      let monitorFrame;
      let chunks = [];
      let heardSpeech = false;
      let speechDuration = 0;
      let lastSpeechAt = 0;
      let lastMonitorAt = 0;
      let turnStartedAt = 0;
      let noiseFloor = null;
      let speechPeak = 0;
      let currentAudioUrl;

      const NOISE_CALIBRATION_MS = 300;
      const REQUIRED_SPEECH_MS = 160;
      const END_SILENCE_MS = 1800;
      const EMPTY_TURN_MS = 15000;
      const MAX_TURN_MS = 30000;

      button.addEventListener('click', () => active ? stopConversation() : startConversation());

      async function startConversation() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          audioContext = new AudioContext();
          const source = audioContext.createMediaStreamSource(stream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);
          active = true;
          button.textContent = 'End conversation';
          button.classList.add('stop');
          startListeningTurn();
        } catch (_) {
          setStatus('I could not use the microphone. Please allow microphone access and try again.');
        }
      }

      function stopConversation() {
        active = false;
        cancelAnimationFrame(monitorFrame);
        if (recorder?.state === 'recording') recorder.stop();
        stream?.getTracks().forEach(track => track.stop());
        audio.pause();
        window.speechSynthesis.cancel();
        audioContext?.close();
        button.textContent = 'Start conversation';
        button.classList.remove('stop');
        micActivity.classList.add('hidden');
        setStatus('Conversation ended. I’ll be here when you want to talk again.');
      }

      function startListeningTurn() {
        if (!active) return;
        chunks = [];
        heardSpeech = false;
        speechDuration = 0;
        lastSpeechAt = 0;
        lastMonitorAt = performance.now();
        turnStartedAt = performance.now();
        noiseFloor = null;
        speechPeak = 0;
        recorder = new MediaRecorder(stream);
        recorder.addEventListener('dataavailable', event => {
          if (event.data.size) chunks.push(event.data);
        });
        recorder.addEventListener('stop', processTurn, { once: true });
        recorder.start(250);
        micActivity.classList.remove('hidden');
        setStatus('Listening… Just speak naturally.', true);
        monitorSilence();
      }

      function monitorSilence() {
        if (!active || recorder?.state !== 'recording') return;
        const samples = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(samples);
        const rms = Math.sqrt(samples.reduce((sum, value) => sum + value * value, 0) / samples.length);
        const now = performance.now();
        const elapsed = Math.min(now - lastMonitorAt, 100);
        lastMonitorAt = now;
        const turnAge = now - turnStartedAt;

        // Learn the room level briefly. Start and continuation use different
        // thresholds so soft speech starts reliably but steady noise does not
        // keep extending the recording after the speaker stops.
        if (turnAge < NOISE_CALIBRATION_MS) {
          noiseFloor = noiseFloor === null ? rms : noiseFloor * 0.8 + rms * 0.2;
          updateMicMeter(rms, noiseFloor, 'Calibrating room sound', 'waiting');
          monitorFrame = requestAnimationFrame(monitorSilence);
          return;
        }

        const startThreshold = Math.min(Math.max(0.007, noiseFloor * 1.7), 0.018);
        if (!heardSpeech) {
          if (rms > startThreshold) {
            speechDuration += elapsed;
            updateMicMeter(rms, startThreshold, 'Sound detected', 'sound');
          } else {
            speechDuration = 0;
            noiseFloor = noiseFloor * 0.94 + rms * 0.06;
            updateMicMeter(rms, startThreshold, 'Waiting for voice', 'waiting');
          }

          if (speechDuration >= REQUIRED_SPEECH_MS) {
            heardSpeech = true;
            lastSpeechAt = now;
            speechPeak = rms;
            setStatus('I’m listening…', true);
          }
        } else {
          speechPeak = Math.max(rms, speechPeak * 0.995);
          const continuationThreshold = Math.max(0.006, noiseFloor * 1.4, speechPeak * 0.22);
          if (rms > continuationThreshold) {
            lastSpeechAt = now;
            updateMicMeter(rms, continuationThreshold, 'Voice detected', 'voice');
          } else {
            updateMicMeter(rms, continuationThreshold, 'Waiting for pause', 'waiting');
          }
        }

        if (heardSpeech && now - lastSpeechAt > END_SILENCE_MS) {
          cancelAnimationFrame(monitorFrame);
          recorder.stop();
          return;
        }

        if (turnAge > MAX_TURN_MS || (!heardSpeech && turnAge > EMPTY_TURN_MS)) {
          cancelAnimationFrame(monitorFrame);
          recorder.stop();
          return;
        }
        monitorFrame = requestAnimationFrame(monitorSilence);
      }

      async function processTurn() {
        if (!active) return;
        if (!heardSpeech) {
          startListeningTurn();
          return;
        }

        try {
          micActivity.classList.add('hidden');
          setStatus('Let me make sure I heard you correctly…');
          const form = new FormData();
          const mimeType = (recorder.mimeType || 'audio/webm').split(';')[0];
          const extension = mimeType.includes('mp4') ? 'mp4' : mimeType.includes('ogg') ? 'ogg' : 'webm';
          const recording = new Blob(chunks, { type: mimeType });
          if (recording.size < 1024) {
            setStatus('I didn’t hear enough audio. Please try again.');
            return resumeSoon();
          }
          form.append('audio', recording, `conversation.${extension}`);
          form.append('user_id', userId);
          const transcription = await requestJson('/api/transcribe', { method: 'POST', body: form });

          if (!transcription.transcript) {
            setStatus('I didn’t quite catch that. Please try again.');
            return resumeSoon();
          }

          transcriptElement.textContent = transcription.transcript;
          replyElement.textContent = 'Thinking…';
          messages.classList.remove('hidden');
          setStatus('Thinking of a gentle reply…');

          const companion = await requestJson('/api/companion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, text: transcription.transcript })
          });
          replyElement.textContent = companion.reply;
          setStatus('Here’s what I’m thinking…');

          const speechResponse = await fetch('/api/speak', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: companion.reply })
          });
          if (!speechResponse.ok) {
            setStatus('Speaking with the device voice…');
            await speakWithDeviceVoice(companion.reply);
            if (active) startListeningTurn();
            return;
          }

          if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
          currentAudioUrl = URL.createObjectURL(await speechResponse.blob());
          audio.src = currentAudioUrl;
          await audio.play();
          await new Promise(resolve => {
            audio.addEventListener('ended', resolve, { once: true });
            audio.addEventListener('error', resolve, { once: true });
          });
          if (active) startListeningTurn();
        } catch (error) {
          setStatus(error.message || 'Something went wrong. I’ll listen again in a moment.');
          resumeSoon();
        }
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'The request could not be completed.');
        return data;
      }

      function speakWithDeviceVoice(text) {
        return new Promise(resolve => {
          if (!('speechSynthesis' in window)) {
            resolve();
            return;
          }
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          const voices = window.speechSynthesis.getVoices();
          utterance.voice = voices.find(voice =>
            /^en/i.test(voice.lang) && /samantha|karen|moira|victoria|zira/i.test(voice.name)
          ) || voices.find(voice => /^en/i.test(voice.lang)) || null;
          utterance.lang = 'en-US';
          utterance.rate = 0.88;
          utterance.pitch = 1.02;
          utterance.volume = 1;
          utterance.addEventListener('end', resolve, { once: true });
          utterance.addEventListener('error', resolve, { once: true });
          window.speechSynthesis.speak(utterance);
        });
      }

      function resumeSoon() {
        if (active) setTimeout(startListeningTurn, 1200);
      }

      function updateMicMeter(level, threshold, label, state) {
        const displayMaximum = 0.05;
        const levelPercent = Math.min(100, Math.max(1, level / displayMaximum * 100));
        const thresholdPercent = Math.min(98, Math.max(2, threshold / displayMaximum * 100));
        micFill.style.transform = `scaleX(${levelPercent / 100})`;
        micThreshold.style.left = `${thresholdPercent}%`;
        micState.textContent = label;
        micActivity.classList.toggle('sound', state === 'sound');
        micActivity.classList.toggle('voice', state === 'voice');
      }

      function setStatus(message, listening = false) {
        status.textContent = message;
        status.classList.toggle('pulse', listening);
      }
    </script>
  </body>
</html>
